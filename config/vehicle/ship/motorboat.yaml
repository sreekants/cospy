hydrodynamics:
    north: 1
    east: 2
    yaw: 0 
    yaw_ref: 45 
    speed: 5
    speed_ref: 7
    yaw_rate: 0
    dt: 0.0002

# Specification: Recreational — no path following, high momentum (preserves speed),
physics:
    # Category values for a small motorboat: representative of the class, not of one ship.
    # mass is the displacement at the design load line, in tonnes, and the default weight of a
    # vessel whose vessel.s3db record gives none. deadweight is what it can carry, in tonnes;
    # lightship = mass - deadweight. The hydrodynamic model uses each vessel's own weight.
    mass: 6
    deadweight: 1.5
    linear_damping_coeff: 500000000
    length: 10             # metres, length overall
    width: 3.4     # metres, greatest breadth; source: Botnia Targa 32 (10.8 m), beam 3.38 m, broker listings
    draft: 1.1         # metres; source: Botnia Targa 32 (10.8 m, 6.4 t), broker listings
    momentum: 0.42
    relative_size: "small"

activity:
    type                : "motorboat" 
    activity            : "recreation" 

maneuverability:
    max_yaw_rate        : 10.0   # degrees per timestep
    max_speed           : 100    # speed per timestep

behavior:
    tss_min_dist     : 800.0  # metres; normal separation inside tss
    tss_angle_tol    : 30.0   # degrees; tolerance before lane correction kicks in

    # overtaking thresholds
    overtake_lat_min : 55.0   # metres; lateral separation while overtaking

    # crossing thresholds
    crossing_aft_min    : 50.0   # metres; crossing at aft of tss vessel
    crossing_fore_min   : 250.0  # metres; crossing in front of approaching tss vessel

    range_visibility    : 100    # range of situations observation
    range_ample_time    : 50     # range of collision avoidance 
    range_safety        : 10     # range for safety maneuvers

    stop_on_traffic     : false

pipeline:
    # Steps a planned vessel behaviour runs, by name; the table of steps is
    # maritime.behavior.vessels.VesselPipeline. An unknown step, a step in the wrong list, or a
    # step its behaviour class cannot run stops the vessel's build.
    #   ops     -- each update the vessel can move, in order: each step adjusts the velocity the
    #              previous one left
    #   postops -- after the vessel has moved; they may assume it moved
    #   syncops -- every update, moving or not (at anchor, halted, end of path)
    # Recreational craft: slows to cross lane traffic and regains speed; shows its signals
    ops             : [ tss_compliance, overtaking_distance, apply_momentum, crossing_slowdown ]
    postops         : [ restore_speed ]
    syncops         : [ navigation_lights, day_shapes, fog_signals ]

cargo:
    manifest        : [none]   # Cargo classes carried, matched against zones.yaml restricted_cargo; 'none' declares an empty hold
    humans_present  : 2

devices:
     - name: RADAR
       driver: maritime.device.communication.Radar
       args: sample.frequency=1
