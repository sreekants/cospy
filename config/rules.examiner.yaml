packages:
  modules:  # Examiner modules
     # Drives the practice faculties and inspectors, separately from the COLREG
     # evaluator that drives the rules, with its own cadence (REQ.028, REQ.051).
     - name: Practice.Evaluator
       module: maritime.practice.PracticeEvaluator
       config: sample.frequency=1 resolvers=$(CONFIG)/legata.yaml

     # Practice faculties (REQ.051): each continuous check has one, which posts
     # every situation it observes as an Examination to /Faculty/Practice/Examiners.
     # Examiners examine nothing else. Practice.Evaluator drives them in this order
     # each pass; the epoch faculty always runs last.
     #   examination  ExaminationType the check posts
     #   situations   subjects (each vessel under test) or encounters (each
     #                encounter reported since the last pass, once)
     #   ticks        epoch length in ticks; 1 ends an epoch every pass
     - name: Encounters.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=ENCOUNTER situations=encounters

     - name: Grounding.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=GROUNDING situations=subjects

     - name: Berthing.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=BERTHING situations=subjects

     - name: Speed.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=SPEED situations=subjects

     - name: NightTime.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=NIGHT_TIME situations=subjects

     - name: Signal.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=SIGNAL situations=subjects

     - name: Nuisance.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=NUISANCE situations=subjects

     - name: Cargo.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=CARGO situations=subjects

     - name: ExtremeWeather.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=EXTREME_WEATHER situations=subjects

     - name: Risk.Faculty
       module: maritime.practice.PracticeFaculty
       config: examination=RISK situations=subjects

     - name: Epoch.Faculty
       module: maritime.practice.EpochFaculty
       config: ticks=1

     # The concern examiners read their zone-local rules, thresholds and
     # penalty scorecard from config/examiner/zones.yaml. 'zones' is the only
     # argument most of them need, and it defaults to that path when omitted.
     #
     # epoch: length, in ticks, of an EpisodeWatcher epoch (default 10). Grounding
     # and Berthing score one near miss per epoch inside the margin; Collision and
     # ExtremeWeather publish each epoch of DCPA under report.dcpa or P(capsize) at
     # or above alarm_threshold on their report topic.
     - name: Approach
       module: rules.examiner.navigation.ApproachExaminer

     - name: Berthing
       module: rules.examiner.navigation.BerthingExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml epoch=10

     - name: Collision
       module: rules.examiner.navigation.CollisionExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml report.dcpa=500 epoch=10

     - name: DayTime
       module: rules.examiner.navigation.DayTimeExaminer

     - name: ExtremeWeather
       module: rules.examiner.navigation.ExtremeWeatherExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml
               network=$(CONFIG)/risk/capsize.model.xdsl
               bindings=$(CONFIG)/risk/capsize.model.yaml
               epoch=10

     - name: Grounding
       module: rules.examiner.navigation.GroundingExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml epoch=10

     - name: LaneDiscipline
       module: rules.examiner.navigation.LaneDisciplineExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: NightTime
       module: rules.examiner.navigation.NightTimeExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: Nuisance
       module: rules.examiner.navigation.NuisanceExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: Overtaking
       module: rules.examiner.navigation.OvertakingExaminer

     - name: Signal
       module: rules.examiner.navigation.SignalExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: Speed
       module: rules.examiner.navigation.SpeedExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml tolerance=0.5

     - name: Customs
       module: rules.examiner.security.CustomsExaminer

     - name: ZoneViolation
       module: rules.examiner.security.ZoneViolationExaminer

     - name: Comfort
       module: rules.examiner.planning.ComfortExaminer

     - name: Economic
       module: rules.examiner.planning.EconomicExaminer

     - name: Plan
       module: rules.examiner.planning.PlanExaminer

     - name: Environmental.Cargo
       module: rules.examiner.environmental.CargoExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml report.undeclared=1
