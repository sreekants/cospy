# Rl - the zone-specific loss matrix for this territory.
#
# Rl is the third facet of the risk formalism, R_ev = Ro . Rw . Rl. The CS&Law
# paper leaves it to be "computed, for example, by averaging the penalties for
# maritime infractions issued in a specific location over a recent period".
# Here it is computed instead from the Bayesian risk network: the network gives
# the probability of each consequence, this file gives what that consequence is
# worth, and the product is a cell of Rl.
#
# Rl cannot be defined in code because it is doubly specific:
#
#   * to a DOMAIN   - what a fatality or a hull is worth is a national
#                     convention, and the currency differs;
#   * to a TERRITORY - the same physical outcome is valued differently by where
#                     it happens. A collision in a port closes a berth and
#                     exposes third parties; the same collision on the high
#                     seas does not.
#
# So the matrix is parameterised as
#
#     Rl[zone][concern] = SUM over consequences of that concern:
#                             P(state) * cost[node][state] * zone_factor[zone][concern]
#
# with the probabilities from the network and everything else from this file.
# Copy it into another $(COUNTRY)/$(LOCATION) and edit the numbers; no code
# changes when a jurisdiction changes.

risk:
  # No currency key. Every valuation in the platform is USD, declared once in
  # RiskModel.CURRENCY, so that two territories cannot disagree about what a
  # stored number means.

  # --- the i axis: spatial zones ------------------------------------------
  # Four zones, declared outermost first. A vessel usually sits inside several
  # overlapping map shapes at once - a traffic lane inside a strait inside a
  # territorial sea - so classification takes the INNERMOST jurisdictional
  # match in this order and ignores types not listed here. Topological types
  # (FJORD, ABYSSAL_PLAIN) and navigational ones (TRAFFIC_LANE) are
  # deliberately absent: they describe the water, not the jurisdiction.
  spatial_zones:
    order:
      - high_seas
      - territorial_waters
      - internal_waters
      - port

    mapping:
      high_seas:
        - EXCLUSIVE_ECONOMIC_ZONE
        - CONTIGUOUS_ZONE
      territorial_waters:
        - TERRITORIAL_SEA
        - ARCHIPELAGIC_WATERS
        - STRAIT
      internal_waters:
        - INTERNAL_WATERS
        - WATERWAY
      port:
        - HARBOUR

    # Applied when no jurisdictional shape encloses the vessel.
    default: high_seas

  # --- the j axis: cross-cutting concerns ---------------------------------
  concerns:
    - safety
    - traffic
    - environmental
    - operational

  # --- Rw: relative weight of the concerns --------------------------------
  # One weight per concern, keyed on exactly the concerns above; a missing or
  # unknown key stops the risk examiner at load. Weights are normalised to sum
  # to 1 before use, so only their ratios matter. Uniform is the deliberate
  # null: no concern is weighted above another pending an expert consensus
  # (REQ.004). Rw is recorded in fact_rw and never applied to Rl; R_ev = Ro . Rw . Rl
  # is composed at rollup.
  weights:
    safety: 1.0
    traffic: 1.0
    environmental: 1.0
    operational: 1.0

  # Which concern each consequence node of the network scores into. This is
  # the one mapping the source paper does not supply.
  consequences:
    harm_to_humans: safety
    damage_other_vessel: traffic
    damage_asv: safety
    damage_auv: operational
    mission_failure: operational

  # --- ECONOMIC COST: base cost of each consequence state, USD ---------------------------
  # Table A.5 of Kristensen et al. (2025) states these in NOK. They are
  # restated here at the paper's own implied rate: it gives NOK 2 000 000 as
  # "approx. USD 190 000" and NOK 1 000 000 as "approx. USD 95 000", so
  # 1 NOK = 0.095 USD. Rounded to whole dollars.
  #
  # These remain a foreign valuation converted, not a local one. A
  # deployment that means to assert a local figure - the statistical life
  # value above all, which is a national convention rather than a physical
  # constant - must replace them rather than convert them.
  cost:
    harm_to_humans:
      fatality: 517940       # USD
      none: 0
    damage_other_vessel:
      major: 855000           # USD
      minor: 427500           # USD
      none: 0
    damage_asv:
      major: 190000           # USD
      minor: 95000            # USD
      none: 0
    damage_auv:
      major: 95000            # USD
      minor: 47500            # USD
      none: 0
    mission_failure:
      "yes": 950              # NOK 10 000; quoted, PyYAML reads bare yes/no as booleans
      "no": 0

  # --- Rl proper: how location changes what an outcome is worth -----------
  # A multiplier per (zone, concern). 1.0 means the base cost stands. These
  # are PLACEHOLDERS: they are ordered sensibly - risk of every kind rises as
  # a vessel moves inshore, environmental risk fastest of all because a
  # confined water body cannot disperse a spill - but they are not derived
  # from infraction data and should be replaced before anything is cited.
  zone_factor:
    high_seas:
      safety: 1.0
      traffic: 1.0
      environmental: 1.0
      operational: 1.0
    territorial_waters:
      safety: 1.2
      traffic: 1.4
      environmental: 2.0
      operational: 1.1
    internal_waters:
      safety: 1.5
      traffic: 1.8
      environmental: 3.0
      operational: 1.3
    port:
      safety: 1.8
      traffic: 2.2
      environmental: 4.0
      operational: 1.6
