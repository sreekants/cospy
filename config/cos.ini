; Name: 		cos.ini
; Description: 	This file contains the master settings for modcolreg. All applications
;		refer this file to locate individual settings files. The path to this file is passed 
;		to all applications as a command line argument.

[Folders]
ROOT=$(COS_ROOT)	        ; Root direcory where global configurations reside
CONFIG=$(COS_ROOT)/config   ; Root directory for scenario (episode) configuration data
DB=$(COS_ROOT)/config       ; Root directory for database files, ususally reside 
Workspace=$(ROOT)/build
SourceFolder=$(ROOT)/build/source
StagingFolder=$(ROOT)/build/staging

[EnvironmentVariables]      ; Simulation profile settings
COUNTRY=tk
LOCATION=turkeli
WEATHER=clearsky
TRAFFIC=ldta,fleet
CASE=0                      ; Cases allow multiple instances on the same scenarios to execute
SIMULATION=$(CONFIG)/simulation/$(COUNTRY)/$(LOCATION)
MAP=$(CONFIG)/map/$(COUNTRY)/$(LOCATION)
SCENARIO=scenario-$(CASE):$(COUNTRY)/$(LOCATION)/$(WEATHER)/$(TRAFFIC)

[SystemUtilities.Logger]
ConfigurationFile=$(CONFIG)/logger.yaml
LogFile=$(ROOT)/build/syslog.s3db
; Optional. true prints ctxt.log.debug() messages on the console; absent or any other value leaves them off
DebugTrace=false

[SystemUtilities.Metrics]
MetricsFile=$(ROOT)/build/metrics.s3db

[ProcessManager]
NumThreads=4
RunCycles=1000000
; One thread per faculty group, groups separated by '|'. The first group owns the simulated
; clock and also runs every faculty no group names. Remove the line to run everything on one thread
Affinity=Motion:Subsystem,Environment,Signals,Actors,NetworkServices|Rules:Rules,Monitors
; Simulated clock (REQ.032). One tick stands for SpeedUp x DeltaT simulated seconds; every rate (m/s)
; is multiplied by it to give the tick's displacement.
;   DeltaT  - nominal length of one tick in seconds (default 0.03, today's pause between motion ticks)
;   SpeedUp - simulated seconds per nominal second. Overrides the location's sim.clock.speedup in
;             land.s3db configs. With neither set, one tick is one simulated second.
;   Epoch   - simulated time at tick 0, with the scenario's UTC offset (default 2026-01-01T12:00:00+00:00)
; SecondsPerTick is no longer read; a cos.ini that sets it is refused at startup.
;DeltaT=0.03
;SpeedUp=33.333
;Epoch=2026-06-21T21:00:00+03:00

[Simulation]
Kernel=Subsystem
Faculties=Environment,Monitors,Signals,Actors,Rules
Services=NetworkServices


[Subsystem]
Level-0=$(CONFIG)/subsystem.yaml

[NetworkServices]
Local=$(CONFIG)/network.yaml
API=$(CONFIG)/api.yaml


[Rules]
COLREG=$(CONFIG)/rules.colreg.yaml
MASS=$(CONFIG)/rules.mass.yaml
LocalRules=$(CONFIG)/simulation/$(COUNTRY)/$(LOCATION)/rules.yaml
Competency=$(CONFIG)/rules.examiner.yaml
RiskAssessment=$(CONFIG)/rules.risk.yaml


[Signals]
Beacons=$(CONFIG)/beacon.yaml
Radars=$(CONFIG)/radar.yaml
PortAuthorities=$(CONFIG)/port.yaml
Mapping=$(CONFIG)/mapping.yaml

[Actors]
Vessels=$(CONFIG)/vessel.yaml

[Environment]
Land=$(CONFIG)/land.yaml
Sea=$(CONFIG)/sea.yaml
Sky=$(CONFIG)/sky.yaml
Weather=$(CONFIG)/weather.yaml

[Monitors]
Situation=$(CONFIG)/situation.yaml
Conduct=$(CONFIG)/conduct.yaml
Evaluator=$(CONFIG)/evaluator.yaml
