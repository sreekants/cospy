# The Bayesian risk model of Kristensen et al. (2025), Fig. 2: its
# structure, its states and its conditional probabilities, all as data.
#
# ASVModel.py builds the network from this file and writes
# config/risk/risk.model.xdsl. Nothing about the model is declared in code.

inference:
  network:
    # Node kinds carry the colour legend of Fig. 2 and nothing else; they
    # decide how a node is drawn in GeNIe and how the report groups it.
    # 'states' order is load-bearing: it is the column order of every
    # matrix under 'nodes' below.
    nodes:
      # --- consequence nodes (orange in Fig. 2) ---
      harm_to_humans:
        kind: consequence
        label: "Harm to humans"
        states: [fatality, none]
      damage_other_vessel:
        kind: consequence
        label: "Damage to other vessel"
        states: [major, minor, none]
      damage_asv:
        kind: consequence
        label: "Damage to ASV"
        states: [major, minor, none]
      mission_failure:
        kind: consequence
        label: "Mission failure"
        states: ["yes", "no"]
      damage_auv:
        kind: consequence
        label: "Damage to AUV"
        states: [major, minor, none]

      # --- hazardous events (light blue) ---
      collision:
        kind: HE
        label: "Collision"
        states: ["yes", "no"]
      grounding:
        kind: HE
        label: "Grounding"
        states: ["yes", "no"]
      loss_of_comms:
        kind: HE
        label: "Loss of ASV/AUV communication connection"
        states: ["yes", "no"]

      # --- probability-influencing, updated during operation (blue) ---
      humans_exposed:
        kind: dynamic
        label: "Humans exposed to collision risk"
        states: ["yes", "no"]
      fail_recover_collision:
        kind: dynamic
        label: "Failure of recovery from collision course"
        states: ["yes", "no"]
      fail_recover_grounding:
        kind: dynamic
        label: "Failure of recovery from grounding course"
        states: ["yes", "no"]
      collision_encounter:
        kind: dynamic
        label: "Collision encounter properties"
        states: [critical, noncritical]
      environmental:
        kind: dynamic
        label: "Environmental conditions"
        states: [critical, noncritical]
      own_vessel_fails:
        kind: dynamic
        label: "Own vessel fails to recover"
        states: ["yes", "no"]
      waterway_properties:
        kind: dynamic
        label: "Waterway properties"
        states: [critical, noncritical]
      target_on_collision:
        kind: dynamic
        label: "Target ship on collision course"
        states: ["yes", "no"]
      vessel_on_grounding:
        kind: dynamic
        label: "Vessel on grounding course"
        states: ["yes", "no"]
      size_other_vessel:
        kind: dynamic
        label: "Size of other vessel"
        states: [small, large]
      humans_present:
        kind: dynamic
        label: "Humans present on other vessel"
        states: [many, limited]
      auv_asv_distance:
        kind: dynamic
        label: "AUV/ASV distance"
        states: [state_1, state_2, state_3, state_4, state_5]
      tcpa:
        kind: dynamic
        label: "TCPA"
        states: [state_1, state_2, state_3, state_4, state_5, state_6, state_7, state_8, state_9, state_10]
      dcpa:
        kind: dynamic
        label: "DCPA"
        states: [state_1, state_2, state_3, state_4, state_5, state_6, state_7, state_8, state_9, state_10]
      wind_speed:
        kind: dynamic
        label: "Wind speed"
        states: [critical, noncritical]
      wave_height:
        kind: dynamic
        label: "Wave height"
        states: [critical, noncritical]
      distance_to_shore:
        kind: dynamic
        label: "Distance to shore"
        states: [state_1, state_2, state_3, state_4, state_5, state_6, state_7, state_8, state_9, state_10]
      depth:
        kind: dynamic
        label: "Depth"
        states: [critical, noncritical]

      # --- probability-influencing, static (grey) ---
      manual_control_failure:
        kind: static
        label: "Manual control failure"
        states: ["yes", "no"]
      autonomous_control_failure:
        kind: static
        label: "Autonomous control failure"
        states: ["yes", "no"]
      target_vessel_fails:
        kind: static
        label: "Target vessel fails to recover"
        states: ["yes", "no"]
      comms_system_failure:
        kind: static
        label: "Failure of communication system"
        states: ["yes", "no"]

    # The hazardous events, read back as the joint target for P(any).
    hazards: [collision, grounding, loss_of_comms]

    # Arcs, parent first, read off the arrows in Fig. 2.
    edges:
      - [collision, harm_to_humans]
      - [humans_exposed, harm_to_humans]
      - [collision, damage_other_vessel]
      - [collision, damage_asv]
      - [grounding, damage_asv]
      - [collision, mission_failure]
      - [grounding, mission_failure]
      - [loss_of_comms, mission_failure]
      - [loss_of_comms, damage_auv]
      - [target_on_collision, collision]
      - [fail_recover_collision, collision]
      - [vessel_on_grounding, grounding]
      - [fail_recover_grounding, grounding]
      - [auv_asv_distance, loss_of_comms]
      - [comms_system_failure, loss_of_comms]
      - [size_other_vessel, humans_exposed]
      - [humans_present, humans_exposed]
      - [target_on_collision, humans_exposed]
      - [collision_encounter, fail_recover_collision]
      - [target_vessel_fails, fail_recover_collision]
      - [environmental, fail_recover_collision]
      - [own_vessel_fails, fail_recover_collision]
      - [environmental, fail_recover_grounding]
      - [own_vessel_fails, fail_recover_grounding]
      - [waterway_properties, fail_recover_grounding]
      - [dcpa, collision_encounter]
      - [tcpa, collision_encounter]
      - [wind_speed, environmental]
      - [wave_height, environmental]
      - [manual_control_failure, own_vessel_fails]
      - [autonomous_control_failure, own_vessel_fails]
      - [distance_to_shore, waterway_properties]
      - [depth, waterway_properties]


# --- provenance of the numbers below --------------------------------------
#
# Only two groups come from the paper: the four static priors of Table A.6,
# and the uniform priors on the dynamic input nodes, which is the paper's own
# choice because their evidence is always supplied during operation. Every
# conditional table is a PLACEHOLDER - monotone and sign-correct so the model
# propagates sensibly, but not calibrated and not citable.

sources:
  table_a6: "Kristensen et al. (2025), Table A.6"
  uniform_by_design: "Kristensen et al. (2025), Section 2.3 - uniform by design"
  placeholder: "PLACEHOLDER - elicit with Vinnem et al. (2012) templates"

