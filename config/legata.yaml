language:
  resolvers:  # Legata resolvers
     - scope: 'variables'
       prefix: null
       module: cos.model.resolver.MappingResolver
       config: 

     - scope: 'constants'
       prefix: null
       module: cos.model.resolver.MappingResolver
       config: 

     - scope: 'eez'
       prefix: null
       module: maritime.model.resolver.EEZResolver
       config: 

     - scope: 'harbour'
       prefix: null
       module: maritime.model.resolver.HarbourResolver
       config: 

     - scope: 'lane'
       prefix: null
       module: maritime.model.resolver.LaneResolver
       config: 

     - scope: 'mez'
       prefix: null
       module: maritime.model.resolver.MEZResolver
       config: 

     # Own ship against target ship (COS.026). collision.dcpa: predicted passing
     # distance in metres under which a closing pair is OnCollisionCourse
     # (evaluator.yaml r_min_cpa). Visibility is the midpoint of the scenario
     # WEATHER profile's range in config/weather/profiles.yaml, in nautical miles;
     # visibility.default applies when the profile has none. night.from and night.to:
     # local hours of (OS, TS).Night, the window wrapping midnight (the defaults of
     # examiner/zones.yaml). Vessel behaviours read the same values to show their lights.
     - scope: 'target'
       prefix: null
       module: maritime.model.resolver.TargetResolver
       config: collision.dcpa=100 visibility.default=10 night.from=20 night.to=6

     - scope: 'tss'
       prefix: null
       module: maritime.model.resolver.TSSResolver
       config: 

     - scope: 'os'
       prefix: null
       module: maritime.model.resolver.OwnShipResolver
       config: 

     - scope: 'ts'
       prefix: null
       module: maritime.model.resolver.TargetShipResolver
       config: 

     # COLREG terms (COS.022). stopping.lengths: ship lengths of track reach in a full-astern stop
     # from service speed, the IMO upper bound (MSC.137(76) Standards for ship manoeuvrability, 5.3.1);
     # Rule 19(b) takes the stopping distance to grow with the square of speed up to it, and a safe
     # speed as one that stops the ship within half the visibility.
     - scope: 'colreg'
       prefix: null
       module: maritime.model.resolver.ColregResolver
       config: stopping.lengths=15

     - scope: 'fleet'
       prefix: null
       module: maritime.model.resolver.FleetResolver
       config: 

     - scope: 'sea'
       prefix: null
       module: maritime.model.resolver.SeaResolver
       config:

     - scope: 'land'
       prefix: null
       module: maritime.model.resolver.LandResolver
       config:

     - scope: 'vessel'
       prefix: null
       module: maritime.model.resolver.VesselDeclarationsResolver
       config: filter=Vessel
       database: $(CONFIG)/maritime/regulation/definitions.s3db

