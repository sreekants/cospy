packages:
  modules:  # Examiner modules
     # Drives every examiner under /Faculty/Practice/Examiners, separately from
     # the COLREG evaluator that drives the rules, with its own cadence (REQ.028).
     - name: Practice.Evaluator
       module: maritime.practice.PracticeEvaluator
       config: sample.frequency=1 resolvers=$(CONFIG)/legata.yaml

     # The concern examiners read their zone-local rules, thresholds and
     # penalty scorecard from config/examiner/zones.yaml. 'zones' is the only
     # argument most of them need, and it defaults to that path when omitted.
     - name: Approach
       module: rules.examiner.navigation.ApproachExaminer

     - name: Berthing
       module: rules.examiner.navigation.BerthingExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: Collision
       module: rules.examiner.navigation.CollisionExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml report.dcpa=500

     - name: DayTime
       module: rules.examiner.navigation.DayTimeExaminer

     - name: ExtremeWeather
       module: rules.examiner.navigation.ExtremeWeatherExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml
               network=$(CONFIG)/risk/capsize.model.xdsl
               bindings=$(CONFIG)/risk/capsize.model.yaml

     - name: Grounding
       module: rules.examiner.navigation.GroundingExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: LaneDiscipline
       module: rules.examiner.navigation.LaneDisciplineExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: NightTime
       module: rules.examiner.navigation.NightTimeExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: Overtaking
       module: rules.examiner.navigation.OvertakingExaminer

     - name: Signal
       module: rules.examiner.navigation.SignalExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml

     - name: Speed
       module: rules.examiner.navigation.SpeedExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml tolerance=0.5

     - name: Customs
       module: rules.examiner.security.CustomsExaminer

     - name: ZoneViolation
       module: rules.examiner.security.ZoneViolationExaminer

     - name: Comfort
       module: rules.examiner.planning.ComfortExaminer

     - name: Economic
       module: rules.examiner.planning.EconomicExaminer

     - name: Plan
       module: rules.examiner.planning.PlanExaminer

     - name: Environmental.Cargo
       module: rules.examiner.environmental.CargoExaminer
       config: zones=$(CONFIG)/examiner/zones.yaml report.undeclared=1
